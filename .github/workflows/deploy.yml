name: CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
          
      - name: Build Backend Image
        run: |
          docker build -t jeffrinjojo/backend:${{ github.run_number }} ./backend
          docker save jeffrinjojo/backend:${{ github.run_number }} > backend.tar
          
      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend.tar
          retention-days: 1

  push-backend:
    name: Push Backend
    needs: [build-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Load and Push Backend Image
        run: |
          docker load < backend.tar
          docker push jeffrinjojo/backend:${{ github.run_number }}

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
          
      - name: Build Frontend Image
        run: |
          docker build -t jeffrinjojo/frontend:${{ github.run_number }} ./frontend
          docker save jeffrinjojo/frontend:${{ github.run_number }} > frontend.tar
          
      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: frontend.tar
          retention-days: 1

  push-frontend:
    name: Push Frontend
    needs: [build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-image
          
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Load and Push Frontend Image
        run: |
          docker load < frontend.tar
          docker push jeffrinjojo/frontend:${{ github.run_number }}

  update-manifests:
    name: Update K8s Manifests
    needs: [push-backend, push-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Update and Push Manifests
        run: |
          sed -i 's|image: jeffrinjojo/backend:.*|image: jeffrinjojo/backend:${{ github.run_number }}|' k8s/backend-deploy.yaml
          sed -i 's|image: jeffrinjojo/frontend:.*|image: jeffrinjojo/frontend:${{ github.run_number }}|' k8s/frontend-deploy.yaml
          
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add k8s/backend-deploy.yaml k8s/frontend-deploy.yaml
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Kubernetes images to build ${{ github.run_number }}"
          git push origin main
