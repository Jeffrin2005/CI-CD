name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Important so the workflow can push changes back
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        run: |
          docker build -t jeffrinjojo/backend:${{ github.run_number }} ./backend
          docker push jeffrinjojo/backend:${{ github.run_number }}

      - name: Build and Push Frontend
        run: |
          docker build -t jeffrinjojo/frontend:${{ github.run_number }} ./frontend
          docker push jeffrinjojo/frontend:${{ github.run_number }}

      - name: Update Kubernetes Manifests
        run: |
          sed -i 's|image: jeffrinjojo/backend:.*|image: jeffrinjojo/backend:${{ github.run_number }}|' k8s/backend-deploy.yaml
          sed -i 's|image: jeffrinjojo/frontend:.*|image: jeffrinjojo/frontend:${{ github.run_number }}|' k8s/frontend-deploy.yaml
          git diff -- k8s/backend-deploy.yaml k8s/frontend-deploy.yaml

      - name: Commit and Push Manifests
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add k8s/backend-deploy.yaml k8s/frontend-deploy.yaml
          
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Kubernetes images to build ${{ github.run_number }}"
          git push origin main
