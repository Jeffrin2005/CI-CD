apiVersion: apps/v1
kind: Deployment
metadata:
  name: mern-backend-deployment
  labels:
    app: mern-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mern-backend
  template:
    metadata:
      labels:
        app: mern-backend
    spec:
      containers:
        - name: backend
          image: mern-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: mern-secrets

---

apiVersion: v1
kind: Service
metadata:
  name: mern-backend-service
spec:
  type: ClusterIP
  selector:
    app: mern-backend
  ports:
    - port: 5000
      targetPort: 5000
