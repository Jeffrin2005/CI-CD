name: CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-push-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and Push
        run: |
          docker build -t jeffrinjojo/backend:${{ github.run_number }} ./backend
          docker push jeffrinjojo/backend:${{ github.run_number }}

  build-and-push-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and Push
        run: |
          docker build -t jeffrinjojo/frontend:${{ github.run_number }} ./frontend
          docker push jeffrinjojo/frontend:${{ github.run_number }}

  update-manifests:
    name: Update K8s Manifests
    needs: [build-and-push-backend, build-and-push-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Update and Push Manifests
        run: |
          # Update the images
          sed -i 's|image: jeffrinjojo/backend:.*|image: jeffrinjojo/backend:${{ github.run_number }}|' k8s/backend-deploy.yaml
          sed -i 's|image: jeffrinjojo/frontend:.*|image: jeffrinjojo/frontend:${{ github.run_number }}|' k8s/frontend-deploy.yaml
          
          # Commit and Push
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add k8s/backend-deploy.yaml k8s/frontend-deploy.yaml
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Kubernetes images to build ${{ github.run_number }}"
          git push origin main
