
name: CD - GitOps Deployment

on:
  workflow_run:
    workflows:
      - CI-CD Pipeline
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  update-manifests:
    name: Update Kubernetes Image Tags
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set Image Tag
        id: image
        run: |
          echo "tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Update Frontend Deployment
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          FRONTEND_IMAGE: ${{ vars.FRONTEND_IMAGE }}
        run: |
          IMAGE="${DOCKERHUB_USERNAME}/${FRONTEND_IMAGE}:${IMAGE_TAG}"

          sed -i -E \
            "s#(image:[[:space:]]*).*#\1${IMAGE}#" \
            k8s/frontend-deploy.yaml

      - name: Update Backend Deployment
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          BACKEND_IMAGE: ${{ vars.BACKEND_IMAGE }}
        run: |
          IMAGE="${DOCKERHUB_USERNAME}/${BACKEND_IMAGE}:${IMAGE_TAG}"

          sed -i -E \
            "s#(image:[[:space:]]*).*#\1${IMAGE}#" \
            k8s/backend-deploy.yaml

      - name: Validate Manifest Changes
        run: |
          git diff --check
          git diff -- k8s/

      - name: Commit and Push Changes
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/frontend-deploy.yaml k8s/backend-deploy.yaml

          if git diff --cached --quiet; then
            echo "No Kubernetes manifest changes."
            exit 0
          fi

          git commit -m "chore(cd): deploy image ${IMAGE_TAG}"
          git push origin HEAD:main
