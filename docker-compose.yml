services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mern-backend-compose
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    networks:
      - mern-network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mern-frontend-compose
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - mern-network
    restart: always

networks:
  mern-network:
    driver: bridge
