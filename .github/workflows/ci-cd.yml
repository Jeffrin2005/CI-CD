name: Full-Stack MERN CI/CD Pipeline

# Trigger on any push or pull request to the main branch
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ====================================
  # JOB 1: Test Backend API
  # ====================================
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: 📦 Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: 🧪 Run Automated Tests
        run: |
          cd backend
          npm test

  # ====================================
  # JOB 2: Build & Verify Docker Images
  # ====================================
  build-docker-images:
    needs: test-backend
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Backend Docker Image
        run: |
          docker build -t mern-backend:${{ github.sha }} ./backend

      - name: 🔨 Build Frontend Docker Image
        run: |
          docker build -t mern-frontend:${{ github.sha }} ./frontend

      - name: ✅ Build Verification Complete
        run: echo "🎉 Both Docker images built and tested successfully!"
