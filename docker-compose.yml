version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    # Optional: If you need MongoDB locally instead of Atlas, we can add it here too!
                      
  frontend:
    build: 
      context: ./frontend
    ports:
      - "5173:5173"  # Vite's default port
    depends_on:
      - backend
