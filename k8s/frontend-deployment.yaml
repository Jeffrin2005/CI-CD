apiVersion: apps/v1
kind: Deployment
metadata:
  name: mern-frontend-deployment
  labels:
    app: mern-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mern-frontend
  template:
    metadata:
      labels:
        app: mern-frontend
    spec:
      containers:
        - name: frontend
          image: mern-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: mern-frontend-service
spec:
  type: NodePort
  selector:
    app: mern-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
