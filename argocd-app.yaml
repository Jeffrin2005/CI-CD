apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mern-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Jeffrin2005/CI-CD.git'
    targetRevision: HEAD # Or your branch like 'main' or 'compose'
    path: k8s # The folder where your k8s yaml files are
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
